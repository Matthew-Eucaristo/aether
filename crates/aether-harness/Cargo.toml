[package]
name = "aether-harness"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
aether-kernel = { version = "0.1.0", path = "../aether-kernel" }
aether-world = { version = "0.1.0", path = "../aether-world" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
