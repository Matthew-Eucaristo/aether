[package]
name = "aether-kernel"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
blake3 = "1.8.7"
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
wasmparser = { version = "0.263.0", default-features = false, features = ["std", "validate", "features", "simd"] }
wasmtime = { version = "51.0.0", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = "1.263.0"
aether-world = { version = "0.1.0", path = "../aether-world" }

[dev-dependencies]
arbitrary = "1.5.0"
wasm-smith = "0.263.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
